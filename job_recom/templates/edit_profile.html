{% extends 'base2.html' %}
{% block title %}Edit Profile - JobMatch{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 40px auto;">
    <h2>Edit Profile</h2>
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" name="first_name" id="firstName"
                   class="form-control" value="{{ user.first_name }}">
        </div>

        <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" name="last_name" id="lastName"
                   class="form-control" value="{{ user.last_name }}">
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" name="location" id="location"
                   class="form-control" value="{{ profile.location }}">
        </div>

        <div class="mb-3">
            <label for="skills" class="form-label">Skills</label>
            <input type="text" name="skills" id="skills"
                   class="form-control" value="{{ profile.skills }}">
        </div>

        <div class="mb-3">
            <label for="experience" class="form-label">Years of Experience</label>
            <input type="number" name="experience_years" id="experience"
                   class="form-control" value="{{ profile.experience_years }}">
        </div>

        <div class="mb-3">
            <label for="preferredLocation" class="form-label">Preferred Job Location</label>
            <input type="text" name="preferred_location" id="preferredLocation"
                   class="form-control" value="{{ profile.preferred_location }}">
        </div>

        <div class="mb-3">
            <label for="salary" class="form-label">Preferred Minimum Salary</label>
            <input type="number" step="0.01" name="preferred_salary_min" id="salary"
                   class="form-control" value="{{ profile.preferred_salary_min }}">
        </div>

        <div class="mb-3">
            <label for="remote" class="form-label">Open to Remote Work?</label>
            <select name="preferred_remote" id="remote" class="form-select">
                <option value="True" {% if profile.preferred_remote %}selected{% endif %}>Yes</option>
                <option value="False" {% if not profile.preferred_remote %}selected{% endif %}>No</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="bio" class="form-label">Bio</label>
            <textarea name="bio" id="bio" class="form-control" rows="3">{{ profile.bio }}</textarea>
        </div>

        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{% url 'profile' %}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

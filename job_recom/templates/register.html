{% extends 'base.html' %}

{% block title %}Register - JobMatch{% endblock %}

{% block content %}
<div class="login-section" style="display:flex; justify-content:center; align-items:center; height:100vh; overflow:auto; padding: 1rem;">
    <div class="login-card" style="background:white; padding:2rem; border-radius:8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width:100%; max-width:500px; max-height:90vh; overflow-y:auto;">
        <h2 style="text-align:center; margin-bottom:1rem;">Create an Account</h2>

        <form method="post">
            {% csrf_token %}

            {% for field in form %}
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="display:inline-block; width: 140px; font-weight:bold;">
                        {{ field.label }}:
                    </label>
                    {{ field }}
                    <div style="color:red; font-size:0.8rem;">{{ field.errors }}</div>
                </div>
            {% endfor %}

            <button type="submit" class="login-btn" style="background:#6a5094; color:white; border:none; padding:10px; width:100%; cursor:pointer;">Register</button>
        </form>

        <div class="login-footer" style="margin-top:1rem; text-align:center;">
            <p>Already have an account? <a href="{% url 'login' %}">Sign In</a></p>
        </div>  
    </div>
</div>
{% endblock %}
